name: Validate and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: cargo fmt --all -- --check
      - run: cargo test -p discord-core --locked
      - run: cargo clippy -p discord-core --locked -- -D warnings
      - run: npm ci && npm test && npm run build
        working-directory: apps/desktop
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
